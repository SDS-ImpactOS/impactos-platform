name: SDS ImpactOS - CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "impactos-backend/**"
      - "impactos-frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "impactos-backend/**"
      - "impactos-frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou tag à vérifier (laisser vide pour la référence courante)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: impactos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # BACKEND
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_sqlite, bcmath, xml, curl, zip, intl
          coverage: none

      - name: Install backend dependencies
        working-directory: impactos-backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        working-directory: impactos-backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        working-directory: impactos-backend
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

      - name: Check Laravel code style
        working-directory: impactos-backend
        run: |
          if [ -x vendor/bin/pint ]; then
            vendor/bin/pint --test
          else
            echo "Laravel Pint is not installed; skipping style check."
          fi

      # FRONTEND
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: impactos-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: impactos-frontend
        run: npm ci

      - name: Check TypeScript
        working-directory: impactos-frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: impactos-frontend
        run: npm run lint --if-present

      - name: Run frontend tests
        working-directory: impactos-frontend
        run: npm run test --if-present -- --run

      - name: Build frontend
        working-directory: impactos-frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
