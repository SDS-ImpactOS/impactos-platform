name: SDS ImpactOS - Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou tag à déployer en staging"
        required: true
        default: develop

permissions:
  contents: read

concurrency:
  group: impactos-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # BACKEND BUILD
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_pgsql, bcmath, xml, curl, zip, intl
          coverage: none

      - name: Install backend dependencies
        working-directory: impactos-backend
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # FRONTEND BUILD
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: impactos-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: impactos-frontend
        run: npm ci

      - name: Build frontend
        working-directory: impactos-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_STAGING_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "VITE_STAGING_API_URL is missing"; exit 1; }
          npm run build

      # SSH
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BACKEND_PATH: ${{ secrets.BACKEND_STAGING_PATH }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_STAGING_PATH }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS BACKEND_PATH FRONTEND_PATH; do
            if [ -z "${!name}" ]; then
              echo "Required secret is missing: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare staging directories
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          BACKEND_PATH: ${{ secrets.BACKEND_STAGING_PATH }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_STAGING_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$BACKEND_PATH' '$FRONTEND_PATH'"

      - name: Deploy backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          BACKEND_PATH: ${{ secrets.BACKEND_STAGING_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='.git/' \
            -e "ssh -p $SSH_PORT" \
            impactos-backend/ "$SSH_USER@$SSH_HOST:$BACKEND_PATH/"

      - name: Run backend migrations
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          BACKEND_PATH: ${{ secrets.BACKEND_STAGING_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$BACKEND_PATH' &&
             php artisan migrate --force &&
             php artisan optimize"

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_STAGING_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            impactos-frontend/dist/ "$SSH_USER@$SSH_HOST:$FRONTEND_PATH/"
